name: CI/CD Pipeline for Express Service

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Security audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Secret scan with GitLeaks
        run: gitleaks detect --redact --exit-code 0 --report-path gitleaks-report.json
        continue-on-error: true

      - name: Post GitLeaks results to platform
        run: |
          if [ -f gitleaks-report.json ]; then
            curl -X POST "$PLATFORM_URL/api/v1/security/scan-results" -d @gitleaks-report.json
          fi
        env:
          PLATFORM_URL: ${{ secrets.PLATFORM_URL }}

      - name: SonarCloud SAST scan
        run: |
          sonar-scanner -Dsonar.projectKey=Dsamarareddy_ai-devops-demo -Dsonar.login=${{ secrets.SONAR_TOKEN }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Post SonarCloud results to platform
        run: |
          if [ -f .scannerwork/report-task.txt ]; then
            curl -X POST "$PLATFORM_URL/api/v1/security/scan-results" -d @.scannerwork/report-task.txt
          fi
        env:
          PLATFORM_URL: ${{ secrets.PLATFORM_URL }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ secrets.DOCKER_REGISTRY }}/dsamarareddy/ai-devops-demo:latest

      - name: Run Trivy security scanner on Docker image
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          scan-ref: ${{ secrets.DOCKER_REGISTRY }}/dsamarareddy/ai-devops-demo:latest
          format: 'json'
          output: trivy-report.json
        continue-on-error: true

      - name: Post Trivy results to platform
        run: |
          if [ -f trivy-report.json ]; then
            curl -X POST "$PLATFORM_URL/api/v1/security/scan-results" -d @trivy-report.json
          fi
        env:
          PLATFORM_URL: ${{ secrets.PLATFORM_URL }}

      - name: Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_REGISTRY }}/dsamarareddy/ai-devops-demo:latest

      - name: Deploy to production
        run: echo "Deploy step here (replace with your actual deployment command)"
        env:
          NODE_ENV: production
