name: CI/CD Pipeline for Express Production Deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test-scan-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Secret scan with Gitleaks
        run: |
          GITLEAKS_VERSION=$(curl -sSL https://api.github.com/repos/gitleaks/gitleaks/releases/latest | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{console.log(JSON.parse(d).tag_name.replace(/^v/,''))})")
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          ./gitleaks detect --redact --exit-code 0 --report-format json --report-path gitleaks-report.json
          if [ ! -f gitleaks-report.json ]; then echo '[]' > gitleaks-report.json; fi

      - name: Post Gitleaks scan results
        run: |
          cat > gitleaks-transform.js <<'EOF'
          const fs = require('fs');
          let data = [];
          try { data = JSON.parse(fs.readFileSync('gitleaks-report.json', 'utf8')); } catch (e) { data = []; }
          if (!Array.isArray(data)) data = [];
          const findings = data.map((f) => ({
            type: 'secret',
            severity: 'high',
            title: 'Secret detected: ' + (f.RuleID || f.Rule || 'unknown-rule'),
            description: (f.Description || 'Potential secret leak') + (f.File ? (' in ' + f.File) : '')
          }));
          const body = {
            pipeline_run_id: String(process.env.GITHUB_RUN_ID),
            repository: 'Dsamarareddy/ai-devops-demo',
            environment: 'production',
            scanner: 'gitleaks',
            findings: findings
          };
          fs.writeFileSync('gitleaks-body.json', JSON.stringify(body));
          console.log('gitleaks findings: ' + findings.length);
          EOF
          node gitleaks-transform.js
          curl -sS -w "\nHTTP %{http_code}\n" -X POST "https://ai-devops.apx-cloudalpha.com/api/v1/security/scan-results" -H "X-API-Key: ${{ secrets.PLATFORM_API_KEY }}" -H "Content-Type: application/json" -d @gitleaks-body.json

      - name: Security audit
        run: |
          npm audit --audit-level=moderate || true
          npm audit --json > npm-audit.json || true

      - name: Post npm audit scan results
        run: |
          cat > npm-audit-transform.js <<'EOF'
          const fs = require('fs');
          let data = {};
          try { data = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8')); } catch (e) { data = {}; }
          let counts = {};
          if (data.metadata && data.metadata.vulnerabilities) {
            counts = data.metadata.vulnerabilities;
          } else if (data.vulnerabilities) {
            for (const key of Object.keys(data.vulnerabilities)) {
              const sev = data.vulnerabilities[key].severity || 'low';
              counts[sev] = (counts[sev] || 0) + 1;
            }
          }
          const sevMap = { critical: 'critical', high: 'high', moderate: 'medium', low: 'low', info: 'low' };
          const findings = [];
          for (const key of Object.keys(counts)) {
            if (key === 'total') continue;
            const count = counts[key];
            if (count > 0) {
              findings.push({
                type: 'sca',
                severity: sevMap[key] || 'low',
                title: count + ' ' + key + ' severity dependency vulnerabilities',
                description: 'npm audit found ' + count + ' ' + key + ' severity vulnerabilities in project dependencies'
              });
            }
          }
          const body = {
            pipeline_run_id: String(process.env.GITHUB_RUN_ID),
            repository: 'Dsamarareddy/ai-devops-demo',
            environment: 'production',
            scanner: 'npm-audit',
            findings: findings
          };
          fs.writeFileSync('npm-audit-body.json', JSON.stringify(body));
          console.log('npm-audit findings: ' + findings.length);
          EOF
          node npm-audit-transform.js
          curl -sS -w "\nHTTP %{http_code}\n" -X POST "https://ai-devops.apx-cloudalpha.com/api/v1/security/scan-results" -H "X-API-Key: ${{ secrets.PLATFORM_API_KEY }}" -H "Content-Type: application/json" -d @npm-audit-body.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ai-devops-demo:ci

      - name: Run Trivy security scanner on image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ai-devops-demo:ci
          format: 'json'
          output: 'trivy-image-report.json'
        continue-on-error: true

      - name: Post Trivy scan results
        run: |
          cat > trivy-transform.js <<'EOF'
          const fs = require('fs');
          let data = {};
          try { data = JSON.parse(fs.readFileSync('trivy-image-report.json', 'utf8')); } catch (e) { data = {}; }
          const results = data.Results || [];
          let vulns = [];
          for (const r of results) {
            if (Array.isArray(r.Vulnerabilities)) vulns = vulns.concat(r.Vulnerabilities);
          }
          const sevMap = { CRITICAL: 'critical', HIGH: 'high', MEDIUM: 'medium', LOW: 'low', UNKNOWN: 'low' };
          const order = { CRITICAL: 0, HIGH: 1, MEDIUM: 2, LOW: 3, UNKNOWN: 4 };
          vulns.sort((a, b) => (order[a.Severity] === undefined ? 5 : order[a.Severity]) - (order[b.Severity] === undefined ? 5 : order[b.Severity]));
          const top = vulns.slice(0, 20);
          const findings = top.map((v) => ({
            type: 'container',
            severity: sevMap[v.Severity] || 'low',
            title: v.Title || v.VulnerabilityID || 'Container vulnerability',
            description: ((v.Description || ('Vulnerability ' + v.VulnerabilityID + ' in package ' + v.PkgName)) + '').slice(0, 500),
            cve: v.VulnerabilityID || undefined
          }));
          const body = {
            pipeline_run_id: String(process.env.GITHUB_RUN_ID),
            repository: 'Dsamarareddy/ai-devops-demo',
            environment: 'production',
            scanner: 'trivy',
            findings: findings
          };
          fs.writeFileSync('trivy-body.json', JSON.stringify(body));
          console.log('trivy findings: ' + findings.length);
          EOF
          node trivy-transform.js
          curl -sS -w "\nHTTP %{http_code}\n" -X POST "https://ai-devops.apx-cloudalpha.com/api/v1/security/scan-results" -H "X-API-Key: ${{ secrets.PLATFORM_API_KEY }}" -H "Content-Type: application/json" -d @trivy-body.json

      # Deployment step placeholder - replace with your actual deployment action (e.g., ECS, Cloud Run, etc.)
      - name: Deploy to Production
        run: echo "Deploy to production step goes here."
