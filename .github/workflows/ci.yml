name: CI/CD Pipeline for Express Production Deploy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test-scan-deploy:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          npx sonar-scanner -Dsonar.projectKey=Dsamarareddy_ai-devops-demo -Dsonar.login=$SONAR_TOKEN

      - name: Post SonarQube Results
        env:
          PLATFORM_URL: ${{ secrets.PLATFORM_URL }}
        run: |
          if [ -f 'sonar-report.json' ]; then
            curl -X POST "$PLATFORM_URL/api/v1/security/scan-results" -d @sonar-report.json || true
          fi

      - name: Secret scan with GitLeaks
        run: |
          gitleaks detect --redact --report-format json --report-path gitleaks-report.json --exit-code 0

      - name: Post GitLeaks Results
        env:
          PLATFORM_URL: ${{ secrets.PLATFORM_URL }}
        run: |
          if [ -f 'gitleaks-report.json' ]; then
            curl -X POST "$PLATFORM_URL/api/v1/security/scan-results" -d @gitleaks-report.json || true
          fi

      - name: Security audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ secrets.DOCKER_REGISTRY }}/dsamarareddy/ai-devops-demo:latest

      - name: Run Trivy container scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_REGISTRY }}/dsamarareddy/ai-devops-demo:latest
          format: 'json'
          output: 'trivy-report.json'
        continue-on-error: true

      - name: Post Trivy Scan Results
        env:
          PLATFORM_URL: ${{ secrets.PLATFORM_URL }}
        run: |
          if [ -f 'trivy-report.json' ]; then
            curl -X POST "$PLATFORM_URL/api/v1/security/scan-results" -d @trivy-report.json || true
          fi

      - name: Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_REGISTRY }}/dsamarareddy/ai-devops-demo:latest

      # Deployment step placeholder - replace with your actual deployment action
      - name: Deploy to Production
        run: echo "Deploying to production... (replace with actual deployment step)"