name: CI/CD Pipeline for Node.js Express Production Deploy

on:
  push:
    branches:
      - main

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Security audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Run SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=Dsamarareddy_ai-devops-demo \
            -Dsonar.organization=dsamarareddy \
            -Dsonar.host.url=https://sonarcloud.io

      - name: Post SonarQube scan results
        run: |
          curl -X POST https://ai-devops.apx-cloudalpha.com/api/v1/security/scan-results \
            -H "X-API-Key: ${{ secrets.PLATFORM_API_KEY }}" \
            -d @.scannerwork/report-task.txt || true

      - name: Install and run GitLeaks secret scan
        run: |
          curl -sSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --redact --exit-code 0 --report-path gitleaks-report.json

      - name: Post GitLeaks scan results
        run: |
          curl -X POST https://ai-devops.apx-cloudalpha.com/api/v1/security/scan-results \
            -H "X-API-Key: ${{ secrets.PLATFORM_API_KEY }}" \
            -d @gitleaks-report.json || true

      - name: Deploy to production
        run: echo "Deploy step for production goes here (please specify deployment platform for full automation)"
        env:
          NODE_ENV: production
