name: Express Service CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-test-scan-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: SonarCloud SAST scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          npx sonar-scanner -Dsonar.projectKey=Dsamarareddy_ai-devops-demo -Dsonar.login=$SONAR_TOKEN -Dsonar.host.url=https://sonarcloud.io
          curl -X POST ${{ secrets.PLATFORM_URL }}/api/v1/security/scan-results -d @.scannerwork/report-task.txt

      - name: Secret scan with GitLeaks
        run: |
          gitleaks detect --redact --exit-code 0 --report-path gitleaks-report.json
          curl -X POST ${{ secrets.PLATFORM_URL }}/api/v1/security/scan-results -d @gitleaks-report.json

      - name: Security audit
        run: |
          npm audit --audit-level=moderate > npm-audit-report.txt || true
          curl -X POST ${{ secrets.PLATFORM_URL }}/api/v1/security/scan-results -d @npm-audit-report.txt

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ secrets.DOCKER_REGISTRY }}/dsamarareddy/ai-devops-demo:latest

      - name: Run Trivy security scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_REGISTRY }}/dsamarareddy/ai-devops-demo:latest
          format: 'table'
        continue-on-error: true
        run: |
          echo "Trivy scan results saved to trivy-report.txt"
          curl -X POST ${{ secrets.PLATFORM_URL }}/api/v1/security/scan-results -d @trivy-report.txt

      - name: Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_REGISTRY }}/dsamarareddy/ai-devops-demo:latest

      # Deployment step placeholder
      - name: Deploy to production
        run: echo "Deploy to production step here (add your cloud provider action)"
