name: CI/CD - Node.js Express Production Deploy

on:
  push:
    branches: [main]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Security audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Run SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ github.repository }}
            -Dsonar.organization=${{ github.repository_owner }}
            -Dsonar.host.url=https://sonarcloud.io

      - name: Post SonarQube scan results
        run: |
          if [ -f ".scannerwork/report-task.txt" ]; then
            curl -X POST https://ai-devops.apx-cloudalpha.com/api/v1/security/scan-results \
              -H "X-API-Key: ${{ secrets.PLATFORM_API_KEY }}" \
              -d @.scannerwork/report-task.txt
          fi

      - name: Install and run GitLeaks
        run: |
          curl -sSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --redact --exit-code 0 --report-path gitleaks-report.json

      - name: Post GitLeaks scan results
        run: |
          if [ -f "gitleaks-report.json" ]; then
            curl -X POST https://ai-devops.apx-cloudalpha.com/api/v1/security/scan-results \
              -H "X-API-Key: ${{ secrets.PLATFORM_API_KEY }}" \
              -d @gitleaks-report.json
          fi

      # Deployment step placeholder - replace with your actual deployment action
      - name: Deploy to production
        run: echo "Deploying to production..."
