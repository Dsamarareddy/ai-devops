name: CI/CD Pipeline for Express Service

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test-scan-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Security audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Run SonarQube scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          npm install -g sonar-scanner
          sonar-scanner \
            -Dsonar.projectKey=ai-devops-demo \
            -Dsonar.organization=Dsamarareddy \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.login=$SONAR_TOKEN

      - name: Build Docker image
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and tag Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ai-devops-demo:latest

      - name: Run Trivy security scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/ai-devops-demo:latest
          format: 'json'
          output: 'trivy-report.json'
        continue-on-error: true

      - name: Post Trivy scan results
        env:
          PLATFORM_URL: ${{ secrets.PLATFORM_URL }}
        run: |
          curl -X POST $PLATFORM_URL/api/v1/security/scan-results -d @trivy-report.json

      - name: Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ai-devops-demo:latest

      - name: Secret scan with Gitleaks
        run: |
          curl -sSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --redact --exit-code 0 --report-path gitleaks-report.json

      - name: Post Gitleaks scan results
        env:
          PLATFORM_URL: ${{ secrets.PLATFORM_URL }}
        run: |
          curl -X POST $PLATFORM_URL/api/v1/security/scan-results -d @gitleaks-report.json

      # Deployment step placeholder - replace with your actual deployment action
      - name: Deploy to production
        env:
          NODE_ENV: production
        run: |
          echo "Deploying to production..."
          # Add your deployment commands here (e.g., kubectl, ECS, Cloud Run, etc.)
