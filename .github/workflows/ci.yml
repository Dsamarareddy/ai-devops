name: CI/CD Pipeline for Express Service

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-test-scan-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Security audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Run secret scan with Gitleaks
        run: |
          curl -sSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --redact --exit-code 0 --report-path gitleaks-report.json

      - name: Post Gitleaks results to platform
        run: |
          curl -X POST https://ai-devops.apx-cloudalpha.com/api/v1/security/scan-results \
            -H "X-API-Key: ${{ secrets.PLATFORM_API_KEY }}" \
            -d @gitleaks-report.json

      - name: Install SonarQube scanner and run SAST
        run: |
          npm install -g sonar-scanner
          sonar-scanner \
            -Dsonar.projectKey=ai-devops-demo \
            -Dsonar.organization=Dsamarareddy \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}

      - name: Post SonarQube results to platform
        run: |
          if [ -f "sonar-report.json" ]; then
            curl -X POST https://ai-devops.apx-cloudalpha.com/api/v1/security/scan-results \
              -H "X-API-Key: ${{ secrets.PLATFORM_API_KEY }}" \
              -d @sonar-report.json
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ai-devops-demo:latest

      - name: Run Trivy container scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/ai-devops-demo:latest
          format: 'table'
        continue-on-error: true

      - name: Post Trivy scan results to platform
        run: |
          if [ -f "trivy-report.json" ]; then
            curl -X POST https://ai-devops.apx-cloudalpha.com/api/v1/security/scan-results \
              -H "X-API-Key: ${{ secrets.PLATFORM_API_KEY }}" \
              -d @trivy-report.json
          fi

      - name: Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ai-devops-demo:latest

      # Deployment step placeholder - replace with your actual deployment action (e.g., ECS, Cloud Run, etc.)
      - name: Deploy to production
        run: echo "Deploying to production... (replace with actual deployment step)"