name: CI/CD Pipeline for Express Service

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test-scan:
    name: Build, Test, and Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: SonarCloud Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          npm install -g sonar-scanner
          sonar-scanner -Dsonar.projectKey=Dsamarareddy_ai-devops-demo -Dsonar.login=$SONAR_TOKEN -Dsonar.sources=.
          cp .scannerwork/report-task.txt sonar-report.txt || true

      - name: Post SonarQube Results to Platform
        if: always()
        env:
          PLATFORM_URL: ${{ secrets.PLATFORM_URL }}
        run: |
          if [ -f sonar-report.txt ]; then
            curl -X POST "$PLATFORM_URL/api/v1/security/scan-results" -d @sonar-report.txt || true
          fi

      - name: Secret scan with GitLeaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/latest/download/gitleaks-linux-amd64 -o gitleaks
          chmod +x gitleaks
          ./gitleaks detect --redact --exit-code 0 --report-format json --report-path gitleaks-report.json

      - name: Post GitLeaks Results to Platform
        if: always()
        env:
          PLATFORM_URL: ${{ secrets.PLATFORM_URL }}
        run: |
          if [ -f gitleaks-report.json ]; then
            curl -X POST "$PLATFORM_URL/api/v1/security/scan-results" -d @gitleaks-report.json || true
          fi

      - name: Security audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

  docker-build-scan-push:
    name: Docker Build, Scan, and Push
    runs-on: ubuntu-latest
    needs: build-test-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ secrets.DOCKER_REGISTRY }}/dsamarareddy/ai-devops-demo:latest

      - name: Run Trivy security scanner on Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_REGISTRY }}/dsamarareddy/ai-devops-demo:latest
          format: 'json'
          output: 'trivy-report.json'
        continue-on-error: true

      - name: Post Trivy Results to Platform
        if: always()
        env:
          PLATFORM_URL: ${{ secrets.PLATFORM_URL }}
        run: |
          if [ -f trivy-report.json ]; then
            curl -X POST "$PLATFORM_URL/api/v1/security/scan-results" -d @trivy-report.json || true
          fi

      - name: Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_REGISTRY }}/dsamarareddy/ai-devops-demo:latest

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: docker-build-scan-push
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

