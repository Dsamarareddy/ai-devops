name: CI for Express App

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Security audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Run SonarQube scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          sonar-scanner -Dsonar.projectKey=express-app -Dsonar.login=$SONAR_TOKEN

      - name: Post SonarQube results to platform
        env:
          PLATFORM_URL: ${{ secrets.PLATFORM_URL }}
        run: |
          curl -X POST $PLATFORM_URL/api/v1/security/scan-results -d @.scannerwork/report-task.txt

      - name: Run GitLeaks secret scan
        run: |
          gitleaks detect --redact --exit-code 0 --report-path gitleaks-report.json

      - name: Post GitLeaks results to platform
        env:
          PLATFORM_URL: ${{ secrets.PLATFORM_URL }}
        run: |
          curl -X POST $PLATFORM_URL/api/v1/security/scan-results -d @gitleaks-report.json
