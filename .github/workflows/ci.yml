name: CI/CD Pipeline for Express Service

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: SonarCloud Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          npx sonar-scanner -Dsonar.projectKey=express-service -Dsonar.login=$SONAR_TOKEN

      - name: Post SonarCloud scan results
        env:
          PLATFORM_URL: ${{ secrets.PLATFORM_URL }}
        run: |
          curl -X POST $PLATFORM_URL/api/v1/security/scan-results -d @.scannerwork/report-task.txt || true

      - name: Secret scan with GitLeaks
        run: |
          gitleaks detect --redact --exit-code 0 --report-path gitleaks-report.json

      - name: Post GitLeaks scan results
        env:
          PLATFORM_URL: ${{ secrets.PLATFORM_URL }}
        run: |
          curl -X POST $PLATFORM_URL/api/v1/security/scan-results -d @gitleaks-report.json || true

      - name: Build Docker image
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and tag Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ secrets.DOCKER_REGISTRY }}/express-service:latest

      - name: Run Trivy security scanner on Docker image
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          scan-ref: ${{ secrets.DOCKER_REGISTRY }}/express-service:latest
          format: 'json'
          output: trivy-report.json
        continue-on-error: true

      - name: Post Trivy scan results
        env:
          PLATFORM_URL: ${{ secrets.PLATFORM_URL }}
        run: |
          curl -X POST $PLATFORM_URL/api/v1/security/scan-results -d @trivy-report.json || true

      - name: Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_REGISTRY }}/express-service:latest

      # Deployment step placeholder - replace with your actual deployment action
      - name: Deploy to production
        run: echo "Deploying to production..."
        env:
          NODE_ENV: production
