name: CI/CD Pipeline for Express Production Deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test-scan-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          npm install -g sonar-scanner
          sonar-scanner -Dsonar.projectKey=Dsamarareddy_ai-devops-demo -Dsonar.login=$SONAR_TOKEN -Dsonar.sources=.
          # Assume SonarQube output is in .scannerwork/report-task.txt
          curl -X POST ${{ secrets.PLATFORM_URL }}/api/v1/security/scan-results -d @.scannerwork/report-task.txt

      - name: Secret scan with Gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/latest/download/gitleaks-linux-amd64 -o gitleaks
          chmod +x gitleaks
          ./gitleaks detect --redact --exit-code 0 --report-format json --report-path gitleaks-report.json
          curl -X POST ${{ secrets.PLATFORM_URL }}/api/v1/security/scan-results -d @gitleaks-report.json

      - name: Security audit
        run: |
          npm audit --audit-level=moderate || true
          npm audit --json > npm-audit.json || true
          curl -X POST ${{ secrets.PLATFORM_URL }}/api/v1/security/scan-results -d @npm-audit.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ai-devops-demo:latest

      - name: Run Trivy security scanner on image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/ai-devops-demo:latest
          format: 'json'
          output: 'trivy-image-report.json'
        continue-on-error: true

      - name: Post Trivy scan results
        run: |
          curl -X POST ${{ secrets.PLATFORM_URL }}/api/v1/security/scan-results -d @trivy-image-report.json

      - name: Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ai-devops-demo:latest

      # Deployment step placeholder - replace with your actual deployment action (e.g., ECS, Cloud Run, etc.)
      - name: Deploy to Production
        run: echo "Deploy to production step goes here."
