name: CI/CD Pipeline for Express Service

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Security audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Run SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=Dsamarareddy_ai-devops-demo
            -Dsonar.organization=Dsamarareddy
            -Dsonar.host.url=https://sonarcloud.io

      - name: Post SonarQube scan results
        run: |
          if [ -f ".scannerwork/report-task.txt" ]; then
            curl -X POST https://ai-devops.apx-cloudalpha.com/api/v1/security/scan-results \
              -H "X-API-Key: ${{ secrets.PLATFORM_API_KEY }}" \
              -d @.scannerwork/report-task.txt
          fi

      - name: Run GitLeaks secret scan
        run: |
          curl -sSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --redact --exit-code 0 --report-path gitleaks-report.json

      - name: Post GitLeaks scan results
        run: |
          if [ -f "gitleaks-report.json" ]; then
            curl -X POST https://ai-devops.apx-cloudalpha.com/api/v1/security/scan-results \
              -H "X-API-Key: ${{ secrets.PLATFORM_API_KEY }}" \
              -d @gitleaks-report.json
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ai-devops-demo:latest

      - name: Run Trivy container scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/ai-devops-demo:latest
          format: 'table'
        continue-on-error: true

      - name: Post Trivy scan results
        run: |
          if [ -f "trivy-report.json" ]; then
            curl -X POST https://ai-devops.apx-cloudalpha.com/api/v1/security/scan-results \
              -H "X-API-Key: ${{ secrets.PLATFORM_API_KEY }}" \
              -d @trivy-report.json
          fi

      - name: Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ai-devops-demo:latest

  deploy:
    needs: build-test-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Add your deployment steps here. For example, if deploying to AWS ECS, GCP Cloud Run, or another platform,
      # insert the appropriate action and configuration. Below is a placeholder for a generic deployment step.
      - name: Deploy to Production
        run: echo "Deploying to production..."
