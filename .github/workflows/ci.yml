name: CI/CD - Express Service Deploy to Production

on:
  push:
    branches: [main]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Security audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Run SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=Dsamarareddy_ai-devops-demo
            -Dsonar.organization=Dsamarareddy
            -Dsonar.host.url=https://sonarcloud.io

      - name: Post SonarQube scan results to platform
        run: |
          curl -X POST https://ai-devops.apx-cloudalpha.com/api/v1/security/scan-results \
            -H "X-API-Key: ${{ secrets.PLATFORM_API_KEY }}" \
            -d @.scannerwork/report-task.txt || true

      - name: Install gitleaks and run secret scan
        run: |
          curl -sSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --redact --exit-code 0 --report-path gitleaks-report.json

      - name: Post GitLeaks scan results to platform
        run: |
          curl -X POST https://ai-devops.apx-cloudalpha.com/api/v1/security/scan-results \
            -H "X-API-Key: ${{ secrets.PLATFORM_API_KEY }}" \
            -d @gitleaks-report.json || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: dsamarareddy/ai-devops-demo:ci

      - name: Run Trivy container scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: dsamarareddy/ai-devops-demo:ci
          format: 'table'
        continue-on-error: true

      - name: Post Trivy scan results to platform
        run: |
          if [ -f trivy-report.json ]; then
            curl -X POST https://ai-devops.apx-cloudalpha.com/api/v1/security/scan-results \
              -H "X-API-Key: ${{ secrets.PLATFORM_API_KEY }}" \
              -d @trivy-report.json || true
          fi

      # Deployment step placeholder - replace with your actual deployment action
      - name: Deploy to Production
        run: echo "Deploying to production..."
        env:
          NODE_ENV: production
